<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="oshamaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#660033"/>
      <stop offset="100%" stop-color="#110008"/>
    </radialGradient>
    <linearGradient id="oshamaText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#ff00aa"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#oshamaBg)"/>

  <!-- 猫耳与波点剪影装饰 -->
  <g fill="rgba(255, 255, 255, 0.15)">
    <circle cx="120" cy="120" r="45"/>
    <circle cx="380" cy="120" r="45"/>
    <circle cx="250" cy="280" r="160"/>
  </g>

  <!-- 速度线条 -->
  <line x1="30" y1="80" x2="470" y2="80" stroke="#00ffff" stroke-width="3" stroke-dasharray="12,12" opacity="0.6"/>
  <line x1="30" y1="420" x2="470" y2="420" stroke="#ffff00" stroke-width="3" stroke-dasharray="12,12" opacity="0.6"/>

  <text x="250" y="220" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900" fill="url(#oshamaText)" letter-spacing="1">
    Oshama
  </text>
  <text x="250" y="275" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">
    Scramble!
  </text>

  <text x="250" y="325" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffdd00">
    t+pazolite
  </text>
  <text x="250" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00ffff">
    BPM 196 / EXPERT 12+ / MASTER 13
  </text>
</svg>

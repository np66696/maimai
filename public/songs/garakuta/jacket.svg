<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a0e4e"/>
      <stop offset="60%" stop-color="#1f0322"/>
      <stop offset="100%" stop-color="#0a000c"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- 破碎齿轮与玩偶剪影装饰 -->
  <g stroke="#ff007f" stroke-width="4" fill="none" opacity="0.4">
    <circle cx="250" cy="250" r="180" stroke-dasharray="15,10"/>
    <circle cx="250" cy="250" r="140" stroke-dasharray="5,8"/>
    <circle cx="250" cy="250" r="90"/>
    <line x1="50" y1="250" x2="450" y2="250" stroke="#00f0ff"/>
    <line x1="250" y1="50" x2="250" y2="450" stroke="#00f0ff"/>
  </g>

  <!-- 动态多边形装饰 -->
  <polygon points="250,80 320,200 440,250 320,300 250,420 180,300 60,250 180,200" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.6"/>

  <text x="250" y="210" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" letter-spacing="2">
    Garakuta
  </text>
  <text x="250" y="260" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="3">
    Doll Play
  </text>
  
  <rect x="150" y="285" width="200" height="4" fill="#00f0ff" opacity="0.8"/>

  <text x="250" y="325" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ff77aa" letter-spacing="1">
    t+pazolite
  </text>
  <text x="250" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00f0ff">
    BPM 256 / MASTER 13+
  </text>
</svg>

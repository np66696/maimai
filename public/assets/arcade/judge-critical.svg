<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="critGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff176"/>
      <stop offset="70%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CRITICAL PERFECT 街机倾斜艺术字 -->
  <g transform="skewX(-14) translate(25, 0)">
    <!-- 上方小标 CRITICAL -->
    <text x="140" y="30" font-family="'Arial Black', 'Impact', sans-serif" font-size="20" font-weight="900" fill="#ffffff" stroke="#ff8f00" stroke-width="3" text-anchor="middle" letter-spacing="3" filter="url(#glow)">CRITICAL</text>
    <!-- 下方主标 PERFECT -->
    <text x="140" y="68" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" fill="url(#critGrad)" stroke="#b71c1c" stroke-width="7" stroke-linejoin="round" text-anchor="middle" letter-spacing="2">PERFECT</text>
    <text x="140" y="68" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" fill="url(#critGrad)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">PERFECT</text>
  </g>

  <!-- 闪光星星 -->
  <polygon points="35,18 39,26 48,26 41,31 43,39 35,34 27,39 30,31 23,26 31,26" fill="#fff" filter="url(#glow)"/>
  <polygon points="280,24 283,31 290,31 285,35 287,41 280,37 274,41 276,35 271,31 278,31" fill="#fff" filter="url(#glow)"/>
</svg>

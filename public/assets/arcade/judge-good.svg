<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="goodGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="skewX(-14) translate(20, 0)">
    <text x="90" y="46" font-family="'Arial Black', 'Impact', sans-serif" font-size="42" font-weight="900" fill="url(#goodGrad)" stroke="#052e16" stroke-width="6" stroke-linejoin="round" text-anchor="middle" letter-spacing="2">GOOD</text>
    <text x="90" y="46" font-family="'Arial Black', 'Impact', sans-serif" font-size="42" font-weight="900" fill="url(#goodGrad)" text-anchor="middle" letter-spacing="2" filter="url(#goodGlow)">GOOD</text>
  </g>
</svg>
